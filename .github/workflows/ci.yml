name: CI — eSUSTAV Monolith

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend — Build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend-check:
    name: Backend — Django checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create CI .env for Django
        run: |
          cat > .env <<EOF
          DEBUG=True
          SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY || 'ci-placeholder-secret-key-not-used-in-prod' }}
          GOOGLE_SCOPE_ID=ci-placeholder
          DATABASE_NAME=esustav
          DATABASE_USER=admin
          DATABASE_PASSWORD=placeholder
          DATABASE_HOST=localhost
          DATABASE_PORT=5432
          EOF

      - name: Django system check
        run: python manage.py check

  # ── Docker ──────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — Build images
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-check]
    # Only build Docker images on push to main (not on every PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: false
          tags: esustav-fe:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: esustav-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max